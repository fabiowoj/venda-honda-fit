name: Vendido / à venda

# Botão para marcar o carro como vendido (ou de volta à venda) pelo GitHub,
# até pelo celular: aba Actions → "Vendido / à venda" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      status:
        description: "O carro está:"
        type: choice
        options:
          - vendido
          - à venda
        default: vendido

permissions:
  contents: write
  pages: write

concurrency:
  group: status-do-carro
  cancel-in-progress: false

jobs:
  trocar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aplicar estado
        env:
          STATUS: ${{ inputs.status }}
        run: |
          if [ "$STATUS" = "vendido" ]; then python3 scripts/vendido.py sim; else python3 scripts/vendido.py nao; fi
      - name: Salvar e publicar
        env:
          STATUS: ${{ inputs.status }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "O site já estava como \"$STATUS\". Nada a mudar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Marca o carro como: $STATUS"
          git push
          # Pushes feitos pelo token do Actions podem não disparar o Pages sozinhos; pede a publicação.
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Pages vai publicar pelo push."
