name: Verificar site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Segurança e SEO (metadados das fotos, originais, links, JSON-LD)
        run: python3 scripts/verificar.py
